name: release-tag

# Companion to skip-github-release: this repo suppresses monorepo GitHub
# Releases (they live on the per-language mirrors), so release-please
# never tags. The reusable does the two skipped steps on release-PR
# merge. Details: hop-top/.github references/how-to/release-free-monorepo.md

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  tag:
    if: >
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release-please--branches--')
    uses: hop-top/.github/.github/workflows/release-tag-on-merge.yml@v0
    secrets:
      RELEASE_BOT_APP_ID: ${{ secrets.RELEASE_BOT_APP_ID }}
      RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
